l="#777" font-style="italic">Every agent runs as the same user — reach is scoped credentials, not a sandbox.</text><text x="16" y="24" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="700" fill="#111">Three ways to organize a Claude army</text><text x="16" y="41" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="400" fill="#777">One fleet, three organizations — sorted by how much each group shares. Above each agent, a second and independent dimension: its reach.</text>
