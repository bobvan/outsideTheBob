<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270"
     role="img" aria-label="Think Outside The Bob">
  <!--
    The name is the joke: "Think" sits inside the box, "OutsideTheBob" is out of
    it and climbing away. Reading order gives "Think Outside The Bob".

    Geometry is deliberate. An earlier version rotated 110px text inside a
    960x200 canvas, which put the right end of the wordmark above y=0 and
    clipped the top of "Bob". The canvas is now tall enough for the rotated
    bounding box plus the white outline stroke, with margin to spare.

    textLength pins each string to an exact width, so the layout holds even
    where the font stack resolves to something other than Inter.
  -->

  <!-- The box -->
  <rect x="20" y="90" width="250" height="140" rx="16"
        fill="none" stroke="#111" stroke-width="6"/>

  <!-- Inside the box -->
  <text x="145" y="185" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="72" font-weight="900" fill="#111"
        textLength="190" lengthAdjust="spacingAndGlyphs">Think</text>

  <!-- Outside the box, rising to the right -->
  <g transform="rotate(-8 300 200)">
    <!-- White outline first so the wordmark stays legible on any background -->
    <text x="300" y="200"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="96" font-weight="900"
          textLength="600" lengthAdjust="spacingAndGlyphs"
          text-rendering="geometricPrecision"
          style="paint-order: stroke fill; stroke: #fff; stroke-width: 14;">OutsideTheBob</text>
    <text x="300" y="200"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="96" font-weight="900" fill="#111"
          textLength="600" lengthAdjust="spacingAndGlyphs">OutsideTheBob</text>
  </g>
</svg>
