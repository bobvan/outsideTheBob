<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64"
     role="img" aria-label="Think Outside The Bob">
  <!--
    The favicon is the banner's mark reduced to the joke that survives at 16px:
    the box, and "Bob" breaking out of it.

    Colour works differently here than in the banner. The banner is inlined into
    the page, so its ink is currentColor and it follows the page theme. A favicon
    is always loaded as its own separate document, and it sits in browser chrome
    that has its own light/dark state - so currentColor has nothing to follow and
    the page's CSS cannot reach it. A <style> block with prefers-color-scheme is
    the one mechanism that does work in a standalone SVG favicon, and it is
    honoured by every current browser.

    The classes exist because these rules have to beat what used to be inline
    style="" attributes on the text elements; an inline style would win.
  -->
  <style>
    .ink  { fill: #111; }
    .rule { stroke: #111; }
    /* The halo punches the box wall out from behind the lettering, so it wants
       to be the surface the icon is drawn on - the browser's tab strip, which we
       cannot read. These approximate a light and a dark chrome closely enough at
       16px, where the halo is under a pixel wide. */
    .halo { stroke: #fff; }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #e7e8ea; }
      .rule { stroke: #e7e8ea; }
      .halo { stroke: #1c1d22; }
    }
  </style>

  <!-- Background stays transparent for favicon use -->
  <rect class="rule" x="8" y="8" width="48" height="48" rx="8"
        fill="none" stroke-width="4" />

  <!-- The word "Bob" intentionally extends beyond the box -->
  <g transform="rotate(-8,154.56567,72.498837)"
     font-family="Inter, system-ui, '-apple-system', 'Segoe UI', Roboto, Arial, sans-serif"
     font-size="34px" font-weight="900" text-rendering="geometricPrecision">
    <!-- Stroke pass: the halo that clears the wall from behind the glyphs -->
    <text class="ink halo" x="6" y="26" stroke-width="6"
          style="paint-order: stroke fill;">Bob</text>
    <!-- Fill over the stroke for crisp edges -->
    <text class="ink" x="6" y="26">Bob</text>
  </g>
</svg>
