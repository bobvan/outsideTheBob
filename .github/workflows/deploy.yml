name: Deploy Astro to GitHub Pages (gated)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Prep job reads the repo variable (with a default) and exposes it as an output.
  prep:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.setflag.outputs.deploy }}
    steps:
      - id: setflag
        run: |
          # Fall back to 'false' if the repo variable isn't set
          echo "deploy=${{ vars.PAGES_DEPLOY || 'false' }}" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    if: ${{ needs.prep.outputs.deploy == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.12. Matches the Node 24 LTS the site is built on locally.
          node-version: 24
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: [prep, build]
    if: ${{ needs.prep.outputs.deploy == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4