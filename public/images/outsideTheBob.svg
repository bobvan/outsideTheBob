<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200">
  <!-- Transparent background: good for light/dark pages -->
  <!-- Left box: same relative feel as the favicon, just in a wider canvas -->
  <rect x="24" y="24" width="260" height="152" rx="18"
        fill="none" stroke="#111" stroke-width="6"/>

  <!-- Text group: slight counterclockwise rotation so the baseline rises to the right -->
  <g transform="rotate(-8 220 110)">
    <!-- Outline stroke for legibility on any background -->
    <text x="40" y="128"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="110" font-weight="900"
          text-rendering="geometricPrecision"
          style="paint-order: stroke fill; stroke: #fff; stroke-width: 14;">
      OutsideTheBob
    </text>
    <!-- Solid fill on top -->
    <text x="40" y="128"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="110" font-weight="900" fill="#111">
      OutsideTheBob
    </text>
  </g>

  <!-- Optional: subtle crop line at the far right (disabled by default) -->
  <!-- <line x1="940" y1="0" x2="940" y2="200" stroke="#eee" stroke-width="1"/> -->
</svg>
