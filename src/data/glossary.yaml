# Topics In Timekeeping — glossary.
#
# House rules for an entry:
#   - Two or three sentences. If it needs more, it needs a page, and this entry
#     should link to that page instead of growing.
#   - `authority` is the canonical external definition. Prefer a source with a
#     stable per-term URL (the VIM has one per clause) over a good blog post.
#   - `seeAlso` points into our own pages. An entry with neither an authority
#     nor a seeAlso is a dead end and has not earned its place.
#   - `draft: true` until reviewed, same as everywhere else on this site.
#
# Which terms deserve a page of our own rather than a link out is tracked
# separately in docs/glossary-research.md.

- id: accuracy
  term: Accuracy
  definition: >-
    How close a measured value is to the true value. In the metrologist's
    vocabulary this is not one axis but two combined — **trueness** (freedom
    from systematic error) and **precision** (freedom from random error) — which
    is why "accurate to 15 ns" is ambiguous until you say which of the two you
    are claiming.
  authority:
    label: "VIM 2.13, measurement accuracy"
    url: "https://jcgm.bipm.org/vim/en/2.13.html"
  seeAlso:
    - label: "Trueness"
      href: "#trueness"
    - label: "Precision"
      href: "#precision"
    - label: "Seen side by side"
      href: "/timekeeping/metrology/accuracy-and-precision-in-pictures/"
  draft: true

- id: trueness
  term: Trueness
  definition: >-
    How close the *average* of infinitely many repeated measurements sits to the
    reference value — in datacenter timing, to UTC. It is inversely related to
    systematic error and unrelated to random error, which is the formal way of
    saying that no amount of averaging will ever fix a bias. Mind the grammar:
    your offset from UTC is the *systematic error*, a quantity you can state and
    defend; trueness is the property of that offset being small, and is not
    itself a number.
  authority:
    label: "VIM 2.14, measurement trueness"
    url: "https://jcgm.bipm.org/vim/en/2.14.html"
  seeAlso:
    - label: "UTC"
      href: "#utc"
    - label: "Why averaging a GNSS position hits a floor"
      href: "/timekeeping/antennas/receiver-self-survey/"
  draft: true

- id: precision
  term: Precision
  definition: >-
    How closely repeated measurements agree with each other, whether or not they
    agree with the truth. Averaging improves precision, and that is the whole of
    what averaging does — a tight cluster in the wrong place is precise and
    untrue.
  authority:
    label: "VIM 2.15, measurement precision"
    url: "https://jcgm.bipm.org/vim/en/2.15.html"
  seeAlso:
    - label: "Trueness"
      href: "#trueness"
  draft: true

- id: repeatability
  term: Repeatability
  definition: >-
    Precision measured under conditions held as constant as you can manage: the
    same procedure, operator, instrument and location, over a short enough
    period that nothing drifts. Its counterpart, reproducibility, deliberately
    varies those things — so a result that repeats well but reproduces badly is
    telling you something about your setup rather than about the measurand.
  authority:
    label: "VIM 2.21, measurement repeatability"
    url: "https://jcgm.bipm.org/vim/en/2.21.html"
  seeAlso:
    - label: "Precision"
      href: "#precision"
  draft: true

- id: traceability
  term: Traceability
  definition: >-
    The property of a result that it can be related to a stated reference
    through a documented, unbroken chain of calibrations, each one contributing
    to the total uncertainty. Traceable is not a synonym for accurate: it means
    the path back to the definition is known and its uncertainty accounted for,
    not that the number is good.
  authority:
    label: "VIM 2.41, metrological traceability"
    url: "https://jcgm.bipm.org/vim/en/2.41.html"
  draft: true

- id: stability
  term: Stability
  definition: >-
    In time and frequency, how well an oscillator holds its output over a given
    averaging interval — conventionally characterised by Allan deviation rather
    than by a single number, because the answer depends on how long you watch.
    A clock can be superbly stable and still be wrong, which is why stability
    and accuracy are quoted separately.
  authority:
    label: "VIM 4.19, stability of a measuring instrument (the general sense)"
    url: "https://jcgm.bipm.org/vim/en/4.19.html"
  draft: true

- id: holdover
  term: Holdover
  definition: >-
    What a clock does once its reference disappears: it free-runs on its own
    oscillator and accumulates error. A holdover specification is really a
    statement about time — how long until the error exceeds some threshold you
    care about — so it is meaningless without both the threshold and the
    oscillator.
  seeAlso:
    - label: "Stability"
      href: "#stability"
  draft: true

- id: timescale
  term: Timescale
  definition: >-
    A way of naming instants, built from three things: the length of a tick, a
    zero point, and a count of ticks since. UTC and TAI are timescales; so,
    absurdly but perfectly validly, is *years since Victoria's reign*.
  draft: true

- id: resolution
  term: Resolution
  definition: >-
    The smallest change in the measured quantity that produces a perceptible
    change in what the instrument reports. It bounds what you can *see*, not
    what is *true* — a reading with twelve digits can be twelve digits of
    confidently reported nonsense. And resolution coarser than your actual
    scatter conceals that scatter: a counter ticking every 10 ns, watching a
    source that jitters by 1 ns, returns the same number every time and looks
    flawless.
  authority:
    label: "VIM 4.14, resolution"
    url: "https://jcgm.bipm.org/vim/en/4.14.html"
  seeAlso:
    - label: "Precision"
      href: "#precision"
    - label: "Trueness"
      href: "#trueness"
    - label: "What coarse resolution hides"
      href: "/timekeeping/metrology/accuracy-and-resolution-in-pictures/"
  draft: true

- id: utc
  term: UTC
  aliases: ["Coordinated Universal Time"]
  definition: >-
    The world's civil timescale, computed by the BIPM from the clocks of about
    eighty contributing institutes and published monthly in *Circular T*. It is
    a **deferred-time** scale: nobody can tell you what UTC reads right now,
    because this month's answer is settled next month. Everything that claims to
    distribute UTC in real time is in fact distributing a realisation or a
    prediction of it.
  authority:
    label: "BIPM — Circular T"
    url: "https://www.bipm.org/en/time-ftp/circular-t"
  seeAlso:
    - label: "UTC(k)"
      href: "#utc-k"
    - label: "Traceability"
      href: "#traceability"
  draft: true

- id: utc-k
  term: UTC(k)
  definition: >-
    A national institute's own real-time realisation of UTC — the thing you can
    actually steer to, since UTC itself is not available live. *Circular T*
    publishes the difference [UTC − UTC(k)] every five days, so how far your
    reference sat from the truth is knowable, but only in arrears. BIPM's weekly
    *UTCr* narrows the wait without closing it.
  authority:
    label: "BIPM — Rapid UTC (UTCr)"
    url: "https://www.bipm.org/en/time-ftp/utcr"
  seeAlso:
    - label: "UTC"
      href: "#utc"
  draft: true
