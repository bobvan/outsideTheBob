name: Build Astro (no deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.12. Matches the Node 24 LTS the site is built on locally.
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Upload static site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist