<svg xmlns="http://www.w3.org/2000/svg" width="933" height="293" viewBox="0 0 933 293"
     role="img" aria-label="Think Outside The Bob">
  <!--
    The name is the joke: "Think" sits inside the box, and "OutsideTheBob"
    smashes through the right wall and climbs away, scattering shrapnel.

    The wall is genuinely missing, not merely covered. An earlier version drew
    a complete rect and relied on the wordmark's white outline stroke to hide
    the line behind it, but a halo only follows the outside of a glyph - the
    box line still showed through the counter of the "O". So the box is a path
    with the right wall cut out between y=108 and y=202, which is the band the
    wordmark passes through. Nothing to show through any more.

    The broken ends are jagged and bent outward, the way a wall gives way when
    something goes through it rather than being cut.

    The shrapnel and its motion trails are generated by scripts/gen-shrapnel.mjs
    and pasted in, not hand-placed. Fragments radiate from the rupture at (272,
    155) across a spread of angles and deliberately uneven distances - equal
    distances read as an arc rather than a debris field. Each is an Asteroids
    style rock: 7 to 10 vertices at jittered angles with varying radii and a
    couple pulled deep inward for a concave bite. The script rejects any
    fragment that would collide with the wordmark, the box, or the canvas edge,
    and walks each trail outward until it clears the wordmark, so no trail
    crosses the "O" it came from.

    Geometry is deliberate. An earlier version rotated 110px text inside a
    960x200 canvas, which lifted the right end above y=0 and clipped "Bob".
    The canvas is now sized to the rotated bounding box plus the outline stroke
    and the shrapnel, verified by rasterising and trimming, not by eye.

    textLength pins each string to an exact width so the layout holds under any
    font stack - but kept near each string's natural width, because squeezing
    glyphs horizontally thins their stems and makes a black weight look light.
  -->

  <!-- The box, with the right wall blown out between y=108 and y=202 -->
  <path d="M 36,70
           L 254,70
           A 16,16 0 0 1 270,86
           L 270,98
           L 278,108
           M 278,201
           L 270,211
           L 270,234
           A 16,16 0 0 1 254,250
           L 36,250
           A 16,16 0 0 1 20,234
           L 20,86
           A 16,16 0 0 1 36,70"
        fill="none" stroke="#111" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inside the box -->
  <text x="130" y="185" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="74" font-weight="900" fill="#111"
        textLength="180" lengthAdjust="spacingAndGlyphs">Think</text>

  <!-- Motion trails back to the rupture -->
  <g stroke="#111" stroke-width="1.6" stroke-linecap="round" opacity="0.5">
    <line x1="275.1" y1="66.1" x2="275.5" y2="56.1"/>
    <line x1="288.4" y1="109.9" x2="294.9" y2="92.0"/>
    <line x1="301.1" y1="108.4" x2="343.5" y2="40.5"/>
    <line x1="321.5" y1="105.5" x2="332.8" y2="94.2"/>
    <line x1="350.8" y1="101.9" x2="415.4" y2="58.3"/>
    <line x1="401.6" y1="94.6" x2="485.9" y2="55.3"/>
    <line x1="334.4" y1="191.0" x2="345.6" y2="197.5"/>
    <line x1="311.6" y1="194.6" x2="315.1" y2="198.1"/>
    <line x1="300.7" y1="196.0" x2="334.5" y2="244.3"/>
    <line x1="320.9" y1="193.2" x2="402.0" y2="256.6"/>
    <line x1="287.7" y1="198.2" x2="300.0" y2="232.1"/>
  </g>

  <!-- Shrapnel: irregular fragments radiating from the break -->
  <g fill="#111">
    <polygon points="280.1,40.6 280.2,47.6 274.9,46.6 273.0,41.1 269.0,35.5 275.0,31.3 281.4,35.5"/>
    <polygon points="311.8,73.1 303.0,78.6 298.4,83.0 291.7,81.2 296.3,73.4 298.2,65.5 307.5,68.0"/>
    <polygon points="358.4,27.6 353.5,29.9 349.0,33.6 345.1,29.9 347.9,26.8 351.0,19.6 356.2,20.6"/>
    <polygon points="345.2,84.6 346.3,90.2 342.6,90.1 339.9,85.9 336.8,79.7 341.3,79.2 347.5,80.3"/>
    <polygon points="439.3,47.4 435.1,53.4 430.7,57.3 425.7,51.3 419.9,47.4 424.7,41.7 430.1,37.8 432.5,46.8"/>
    <polygon points="501.1,49.5 502.9,52.8 499.4,55.6 496.2,51.5 492.6,50.6 494.5,45.9 497.7,42.2 501.8,44.8"/>
    <polygon points="364.4,206.1 364.7,209.7 358.6,208.7 354.5,210.9 352.2,205.0 353.9,197.8 359.2,202.2 363.3,199.1"/>
    <polygon points="331.7,209.7 334.0,218.5 326.3,219.7 321.7,214.9 316.3,210.8 324.6,207.7 327.6,200.8 333.5,203.2"/>
    <polygon points="357.2,261.1 351.4,266.9 345.0,265.4 338.4,267.9 333.6,259.4 337.9,249.2 344.8,255.6 352.3,253.4"/>
    <polygon points="416.7,265.5 418.9,269.5 413.8,274.2 411.7,268.8 407.0,266.9 408.9,262.0 414.6,258.4 419.2,261.7"/>
    <polygon points="314.4,246.7 313.2,252.6 306.9,256.5 303.3,249.5 298.2,245.7 299.9,243.5 305.8,240.0 308.9,244.7"/>
  </g>


  <!-- Through the wall and climbing -->
  <g transform="rotate(-8 248 195)">
    <!-- White outline first, so the wordmark stays legible on any background -->
    <text x="248" y="195"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="96" font-weight="900"
          textLength="650" lengthAdjust="spacingAndGlyphs"
          text-rendering="geometricPrecision"
          style="paint-order: stroke fill; stroke: #fff; stroke-width: 14;">OutsideTheBob</text>
    <text x="248" y="195"
          font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
          font-size="96" font-weight="900" fill="#111"
          textLength="650" lengthAdjust="spacingAndGlyphs">OutsideTheBob</text>
  </g>
</svg>
