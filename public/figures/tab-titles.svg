<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img">
<text x="20" y="26" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15.5" font-weight="700" fill="#111">One window, many agents — and the tab bar that nearly ruined it</text><text x="20" y="62" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#c0392b">Before — iTerm2 is labelling tabs from the pane title, which Claude rewrites as it works</text><rect x="20" y="72" width="960" height="40" rx="6" fill="#f4f4f4" stroke="#ddd"/><rect x="26" y="77" width="183.6" height="30" rx="4" fill="#fff" stroke="#bbb"/><text x="117.8" y="96" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#111">Extract agent knowledge to…</text><rect x="215.6" y="77" width="183.6" height="30" rx="4" fill="#eaeaea" stroke="#e0e0e0"/><text x="307.4" y="96" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#555">Drafting the follow-up post</text><rect x="405.2" y="77" width="183.6" height="30" rx="4" fill="#eaeaea" stroke="#e0e0e0"/><text x="497" y="96" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#555">Checking UPS battery self-…</text><rect x="594.8" y="77" width="183.6" height="30" rx="4" fill="#eaeaea" stroke="#e0e0e0"/><text x="686.5999999999999" y="96" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#555">Reviewing DNS zone changes</text><rect x="784.4" y="77" width="183.6" height="30" rx="4" fill="#eaeaea" stroke="#e0e0e0"/><text x="876.1999999999999" y="96" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#555">Analysing overnight TDEV r…</text><text x="20" y="132" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="400" fill="#777" font-style="italic">tmux field:  #T  (pane title)  —  every tab says what its agent is thinking about, and none say who it is</text><text x="20" y="182" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#009E73">After — one line of tmux config, and the tabs say who each agent is</text><rect x="20" y="192" width="960" height="40" rx="6" fill="#f4f4f4" stroke="#ddd"/><rect x="26" y="197" width="183.6" height="30" rx="4" fill="#fff" stroke="#bbb"/><text x="117.8" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#111">meta</text><rect x="215.6" y="197" width="183.6" height="30" rx="4" fill="#eaeaea" stroke="#e0e0e0"/><text x="307.4" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#555">blog</text><rect x="405.2" y="197" width="183.6" height="30" rx="4" fill="#eaeaea" stroke="#e0e0e0"/><text x="497" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#555">proxmox</text><rect x="594.8" y="197" width="183.6" height="30" rx="4" fill="#eaeaea" stroke="#e0e0e0"/><text x="686.5999999999999" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#555">dns</text><rect x="784.4" y="197" width="183.6" height="30" rx="4" fill="#eaeaea" stroke="#e0e0e0"/><text x="876.1999999999999" y="216" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#555">ntp</text><text x="20" y="252" text-anchor="start" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="400" fill="#777" font-style="italic">tmux field:  #W  (window name)  —  set-titles on  ·  set-titles-string '#W'  ·  then detach and reattach</text><text x="980" y="288" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="400" fill="#777" font-style="italic">Both bars are correct renderings of a real field. The bug was which field was being read.</text>
</svg>
